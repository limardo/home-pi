---
exclude: ^(samples|scripts)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^addons/charts/ingress/files/gateway-api/
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: moon-format
        name: moon format (yamlfmt)
        entry: moon run :format --affected --status staged
        language: unsupported
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: uv run yamllint --strict
        language: unsupported
        types: [yaml]
      - id: moon-lint
        name: moon lint (ansible-lint, helm lint)
        entry: moon run :lint --affected --status staged
        language: unsupported
        pass_filenames: false
