apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smarthome.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/**" }}
  {{ include "home-assistant.configKey" $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
