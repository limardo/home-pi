apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smarthome.labels" . | nindent 4 }}
data:
  backup.js: |
    {{- .Files.Get "files/backup.js" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smarthome.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "smarthome.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [node, /scripts/backup.js]
              env:
                - name: MQTT_SERVER
                  value: {{ tpl .Values.mqtt.server . | quote }}
                - name: MQTT_USER
                  value: {{ .Values.mqtt.user | quote }}
                - name: MQTT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mqtt.passwordSecret }}
                      key: {{ .Values.mqtt.user }}
                - name: RETENTION
                  value: {{ .Values.backup.retention | quote }}
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: scripts
              configMap:
                name: {{ .Chart.Name }}-backup
            - name: backup
              nfs:
                server: {{ .Values.global.nfs.server }}
                path: {{ .Values.backup.nfsPath }}
