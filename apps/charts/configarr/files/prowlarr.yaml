prowlarr:
  main:
    base_url: http://prowlarr.{{ .Release.Namespace }}.svc.cluster.local:9696
    api_key: !env PROWLARR_API_KEY

    tags:
      - flaresolverr
      - italian

    sync_profiles:
      data:
        - name: Standard
          enable_rss: true
          enable_automatic_search: true
          enable_interactive_search: true
          minimum_seeders: 1

    indexer_proxies:
      data:
        - name: FlareSolverr
          type: FlareSolverr
          fields:
            host: http://flaresolverr.{{ .Release.Namespace }}.svc.cluster.local:8191
            requestTimeout: 60
          tags: [flaresolverr]

    indexers:
      data: !secret prowlarr_indexers

    applications:
      data:
        {{- if .Values.instances.lidarr }}
        - name: Lidarr
          type: Lidarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr.{{ .Release.Namespace }}.svc.cluster.local:9696
            baseUrl: http://lidarr.{{ .Release.Namespace }}.svc.cluster.local:8686
            apiKey: !env LIDARR_API_KEY
            syncCategories: [3000, 3010, 3030, 3040, 3050, 3060]
        {{- end }}
        {{- if .Values.instances.radarr }}
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr.{{ .Release.Namespace }}.svc.cluster.local:9696
            baseUrl: http://radarr.{{ .Release.Namespace }}.svc.cluster.local:7878
            apiKey: !env RADARR_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
        {{- end }}
        {{- if .Values.instances.sonarr }}
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://prowlarr.{{ .Release.Namespace }}.svc.cluster.local:9696
            baseUrl: http://sonarr.{{ .Release.Namespace }}.svc.cluster.local:8989
            apiKey: !env SONARR_API_KEY
            syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
            animeSyncCategories: [5070]
            syncAnimeStandardFormatSearch: true
        {{- end }}

    download_clients:
      data:
        - <<: *transmission
          fields:
            <<: *transmission_fields
            category: prowlarr
