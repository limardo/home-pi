apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apps.labels" . | nindent 4 }}
data:
  config.yml: |
    trashRevision: {{ .Values.trashRevision }}
    {{- range list "shared" "custom-format-definitions" "sonarr" "radarr" "prowlarr" }}
    {{- if dig . true $.Values.instances }}

    {{- tpl ($.Files.Get (printf "files/%s.yaml" .)) $ | nindent 4 }}
    {{- end }}
    {{- end }}
