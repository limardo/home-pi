apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "mediacenter.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mediacenter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediacenter.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # PUID/PGID have no effect on this image
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TZ
              value: "Europe/Rome"
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_PORT
              value: {{ (first .Values.service).port | quote }}
            - name: ND_SCANNER_SCHEDULE
              value: {{ .Values.scanSchedule | quote }}
            - name: ND_BACKUP_PATH
              value: /backups
            - name: ND_BACKUP_SCHEDULE
              value: {{ .Values.backup.schedule | quote }}
            - name: ND_BACKUP_COUNT
              value: {{ .Values.backup.count | quote }}
            {{- with .Values.metrics }}
            - name: ND_PROMETHEUS_ENABLED
              value: "true"
            - name: ND_PROMETHEUS_METRICSPATH
              value: {{ .path | quote }}
            {{- end }}
          ports:
            {{- range .Values.service }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: {{ .protocol }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}
        - name: music
          nfs:
            server: {{ .Values.global.nfs.server }}
            path: {{ .Values.nfs.musicPath }}
            readOnly: true
        - name: backups
          nfs:
            server: {{ .Values.global.nfs.server }}
            path: {{ .Values.backup.nfsPath }}
