apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mediacenter.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        # No selectorLabels: the jellyfin Service must not select these pods
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              env:
                - name: JELLYFIN_URL
                  value: "http://{{ .Values.name }}.{{ .Release.Namespace }}.svc.cluster.local:8096"
                - name: JELLYFIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.apikeySecret }}
                      key: token
                - name: RETENTION
                  value: {{ .Values.backup.retention | quote }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  # Jellyfin writes the archive into /config/data/backups, the same NFS folder mounted here
                  curl -fsS -m 1800 -X POST "$JELLYFIN_URL/Backup/Create" \
                    -H "Authorization: MediaBrowser Token=\"$JELLYFIN_TOKEN\"" \
                    -H "Content-Type: application/json" \
                    -d '{"Database":true,"Subtitles":true,"Metadata":false,"Trickplay":false}'
                  echo
                  # Jellyfin never deletes old archives; a failed run stops above and prunes nothing
                  ls -1t /backup/*.zip | tail -n +$((RETENTION + 1)) | while read -r f; do
                    rm -f "$f"; echo "removed $(basename "$f")"
                  done
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              nfs:
                server: {{ .Values.global.nfs.server }}
                path: {{ .Values.backup.nfsPath }}
