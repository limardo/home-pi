---
apiVersion: 1
groups:
  - orgId: 1
    name: postgresql
    folder: alerts
    interval: 60s
    rules:
      - uid: postgres-instance-down
        title: PostgresInstanceDown
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum(cnpg_collector_up{namespace="datastores"})
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 3
                  query:
                    params:
                      - B
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Istanza Postgres giù
          description: Meno di 3 istanze del cluster postgresql in datastores rispondono
        labels:
          severity: critical
      - uid: postgres-replication-lag
        title: PostgresReplicationLag
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: max(cnpg_pg_replication_lag{namespace="datastores"})
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Replica Postgres in ritardo
          description: Una replica di postgresql è indietro di più di 5 minuti
        labels:
          severity: warning
      - uid: postgres-volume-full
        title: PostgresVolumeFull
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: max by (persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="datastores"} / kubelet_volume_stats_capacity_bytes{namespace="datastores"})
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.8
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: 'Volume Postgres quasi pieno: {{ $labels.persistentvolumeclaim }}'
          description: 'Il volume {{ $labels.persistentvolumeclaim }} è oltre l''80%: espandi storage.size'
        labels:
          severity: warning
      - uid: postgres-connections-high
        title: PostgresConnectionsHigh
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (pod) (cnpg_backends_total{namespace="datastores"}) / on(pod) cnpg_pg_settings_setting{namespace="datastores",name="max_connections"}
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.8
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Connessioni Postgres alte su {{ $labels.pod }}
          description: '{{ $labels.pod }} usa più dell''80% di max_connections: valuta un Pooler'
        labels:
          severity: warning
      - uid: postgres-backup-stale
        title: PostgresBackupStale
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: time() - kube_cronjob_status_last_successful_time{namespace="datastores",cronjob="postgresql-backup"}
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 93600
                  query:
                    params:
                      - B
        noDataState: Alerting
        execErrState: Alerting
        for: 0m
        annotations:
          summary: Backup Postgres fermo
          description: 'Nessun backup riuscito da più di 26 ore: controlla i job postgresql-backup in datastores'
        labels:
          severity: critical
