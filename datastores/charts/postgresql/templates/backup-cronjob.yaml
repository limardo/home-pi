apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Chart.Name }}-backup
  labels:
    {{- include "datastores.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "datastores.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: pg-dump
              image: {{ .Values.imageName }}
              env:
                # A replica, so the dump does not load the primary
                - name: PGHOST
                  value: {{ .Chart.Name }}-ro
                - name: PGSSLMODE
                  value: require
                - name: PGDATABASE
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Chart.Name }}-backup
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Chart.Name }}-backup
                      key: password
                - name: RETENTION
                  value: {{ .Values.backup.retention | quote }}
              command:
                - bash
                - -c
                - |
                  set -uo pipefail
                  today=$(date +%F)
                  tmp=/backup/$today.tmp
                  rm -rf "$tmp" && mkdir -p "$tmp"
                  failed=0
                  for db in $(psql -tAc "select datname from pg_database where datallowconn and not datistemplate and datname <> 'postgres'"); do
                    if pg_dump --clean --if-exists -d "$db" | gzip > "$tmp/$db.sql.gz"; then
                      echo "ok $db $(du -h "$tmp/$db.sql.gz" | cut -f1)"
                    else
                      echo "FAILED $db"; failed=1
                    fi
                  done
                  # A failed run never replaces or prunes complete backups
                  if [[ $failed -ne 0 ]]; then rm -rf "$tmp"; exit 1; fi
                  rm -rf "/backup/$today" && mv "$tmp" "/backup/$today"
                  ls -1d /backup/????-??-?? | sort -r | tail -n +$((RETENTION + 1)) | while read -r d; do
                    rm -rf "$d"; echo "removed $(basename "$d")"
                  done
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              nfs:
                server: {{ .Values.global.nfs.server }}
                path: {{ .Values.backup.nfsPath }}
