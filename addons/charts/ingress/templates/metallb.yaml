{{- with .Values.services.metallb }}
{{- if .enabled }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .addressPool.name }}
  namespace: {{ include "addons.namespace" $ }}
  labels:
    {{- include "addons.labels" (dict "ctx" $ "name" "metallb") | nindent 4 }}
spec:
  addresses:
    {{- toYaml .addressPool.addresses | nindent 4 }}
  autoAssign: {{ .addressPool.autoAssign }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .l2Advertisement.name }}
  namespace: {{ include "addons.namespace" $ }}
  labels:
    {{- include "addons.labels" (dict "ctx" $ "name" "metallb") | nindent 4 }}
spec:
  ipAddressPools:
    - {{ .addressPool.name }}
{{- end }}
{{- end }}
