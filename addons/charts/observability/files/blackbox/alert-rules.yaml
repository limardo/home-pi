---
- alert: BlackboxProbeDown
  expr: probe_success == 0
  for: 2m
  labels:
    severity: critical
  annotations:
    summary: 'Endpoint down: {{ $labels.instance }}'
    description: >-
      Il probe blackbox per {{ $labels.instance }}
      (module={{ $labels.module }}) è fallito per più di 2 minuti.

- alert: BlackboxSlowProbe
  expr: avg_over_time(probe_duration_seconds[5m]) > 3
  for: 5m
  labels:
    severity: warning
  annotations:
    summary: 'Probe lento: {{ $labels.instance }}'
    description: >-
      La durata media del probe per {{ $labels.instance }} supera 3 s
      negli ultimi 5 minuti — possibile congestione NFS o di rete.
