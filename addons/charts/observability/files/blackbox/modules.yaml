---
http_2xx:
  timeout: 10s
  http:
    valid_status_codes: []  # default: 2xx
    method: GET
    ip_protocol_fallback: false

http_4xx_ok:
  # Services that redirect or require auth (401/403 is still "up")
  prober: http
  timeout: 10s
  http:
    valid_http_versions: ['HTTP/1.1', 'HTTP/2.0']
    valid_status_codes: [200, 301, 302, 401, 403]
    method: GET
    preferred_ip_protocol: ip4
    ip_protocol_fallback: false
    follow_redirects: true

tcp_connect:
  prober: tcp
  timeout: 5s
  tcp:
    preferred_ip_protocol: ip4
    ip_protocol_fallback: false

icmp:
  prober: icmp
  timeout: 5s
  icmp:
    preferred_ip_protocol: ip4
    ip_protocol_fallback: false
