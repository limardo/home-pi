---
apiVersion: 1
groups:
  - orgId: 1
    name: blackbox-exporter
    folder: alerts
    interval: 60s
    rules:
      - uid: blackbox-probe-down
        title: 'BlackboxProbeDown'
        condition: C
        data:
          - refId: A
            datasourceUid: 'PBFA97CFB590B2093'
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: 'probe_success'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              datasource:
                type: prometheus
                uid: 'PBFA97CFB590B2093'
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: 'Target offline: {{`{{ $labels.target }}`}}'
          description: 'Il target {{`{{ $labels.target }}`}} ({{`{{ $labels.instance }}`}}) non risponde al probe'
        labels:
          severity: critical
      - uid: blackbox-slow-probe
        title: 'BlackboxSlowProbe'
        condition: C
        data:
          - refId: A
            datasourceUid: 'PBFA97CFB590B2093'
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: 'avg_over_time(probe_duration_seconds[5m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              datasource:
                type: prometheus
                uid: 'PBFA97CFB590B2093'
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 3
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: 'Probe lento: {{`{{ $labels.target }}`}}'
          description: 'Il probe di {{`{{ $labels.target }}`}} ({{`{{ $labels.instance }}`}}) supera in media 3 s negli ultimi 5 minuti'
        labels:
          severity: warning
  - orgId: 1
    name: cluster
    folder: alerts
    interval: 60s
    rules:
      - uid: node-not-ready
        title: NodeNotReady
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: kube_node_status_condition{condition="Ready",status="true"}
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Nodo {{`{{ $labels.node }}`}} non pronto
          description: 'Il nodo {{`{{ $labels.node }}`}} non è Ready da 5 minuti: bloccato, spento o kubelet fermo'
        labels:
          severity: critical
