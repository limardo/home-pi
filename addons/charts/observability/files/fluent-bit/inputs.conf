[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*.log
    # K0s uses containerd — CRI log format
    multiline.parser  docker, cri
    # Persist read offset across restarts
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On
    Refresh_Interval  10
