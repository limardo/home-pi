[OUTPUT]
    Name              loki
    Match             kube.*
    Host              loki.kube-observability.svc.cluster.local
    Port              3100
    Labels            job=fluent-bit
    # Structured labels queryable in Grafana
    # app and app_kubernetes_io_name allow filtering by service across multiple pods
    Label_Keys        $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name'],$kubernetes['node_name'],$kubernetes['labels']['app'],$kubernetes['labels']['app.kubernetes.io/name']
    Remove_Keys       kubernetes,stream
    line_format       json
    # Retry indefinitely on NFS/Loki hiccups
    Retry_Limit       False
