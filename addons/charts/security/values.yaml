---
namespace: ''

services:
  clusterIssuer:
    enabled: true
    name: home-issuer
    spec:
      acme:
        email: admin@example.com
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: home-issuer-account-key
        solvers:
          - selector:
              dnsZones:
                - example.com
            dns01:
              cnameStrategy: Follow
              route53:
                region: eu-central-1
                hostedZoneID: ZXXXXXXXXXXXXXXXXXXXX
                # Applied by hand from secrets/aws-secret.yaml
                accessKeyIDSecretRef:
                  name: aws-credentials-secret
                  key: AWS_ACCESS_KEY_ID
                secretAccessKeySecretRef:
                  name: aws-credentials-secret
                  key: AWS_SECRET_ACCESS_KEY

charts:
  certManager:
    enabled: true
    name: cert-manager
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.20.2
    config:
      config:
        apiVersion: controller.config.cert-manager.io/v1alpha1
        kind: ControllerConfiguration
        enableGatewayAPI: true
      crds:
        enabled: true
        keep: false
      extraArgs:
        - --dns01-recursive-nameservers-only
        - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      cainjector:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
      prometheus:
        servicemonitor:
          enabled: true

  kyverno:
    enabled: true
    name: kyverno
    chart: kyverno/kyverno
    repository: https://kyverno.github.io/kyverno/
    version: 3.9.1
    config:
      admissionController:
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      backgroundController:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      cleanupController:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      reportsController:
        replicas: 1
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

    policies:
      enabled: true
      name: kyverno-policies
      chart: kyverno/kyverno-policies
      repository: https://kyverno.github.io/kyverno/
      version: 3.9.1
      config:
        podSecurityStandard: custom
      excludedNamespaces:
        - kube-system
      defaultResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 300m
          memory: 256Mi
