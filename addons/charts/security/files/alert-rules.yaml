---
apiVersion: 1
groups:
  - orgId: 1
    name: cert-manager
    folder: alerts
    interval: 60s
    rules:
      - uid: certmanager-cert-expiring
        title: CertificateExpiringSoon
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 21
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 1h
        annotations:
          summary: Certificato {{ $labels.name }} in scadenza
          description: 'Il certificato {{ $labels.exported_namespace }}/{{ $labels.name }} scade tra meno di 21 giorni: cert-manager lo rinnova a 30, quindi il rinnovo sta fallendo'
        labels:
          severity: warning
      - uid: certmanager-cert-not-ready
        title: CertificateNotReady
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: certmanager_certificate_ready_status{condition="True"}
              instant: true
              refId: A
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
          - refId: B
            datasourceUid: '-100'
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: '-100'
          - refId: C
            datasourceUid: '-100'
            model:
              type: threshold
              refId: C
              expression: B
              datasource:
                type: __expr__
                uid: '-100'
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  query:
                    params:
                      - B
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: Certificato {{ $labels.name }} non pronto
          description: 'Il certificato {{ $labels.exported_namespace }}/{{ $labels.name }} non è Ready da 15 minuti: controlla gli eventi del Certificate e dell''Order'
        labels:
          severity: warning
