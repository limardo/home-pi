---

argument_specs:
  main:
    short_description: Nightly k0s backup of the controller to an NFS share
    options:
      backup_nfs_server:
        type: str
        required: true
        description: NFS server that receives the backups.
      backup_nfs_path:
        type: str
        required: true
        description: Exported folder for the backups, under a folder named backups.
      backup_schedule:
        type: str
        default: '*-*-* 02:30:00'
        description: systemd OnCalendar expression.
      backup_retention:
        type: int
        default: 7
        description: Number of archives kept, at least 3.
      backup_textfile_dir:
        type: str
        default: /var/lib/prometheus/node-exporter
        description: Node exporter textfile folder for the last success timestamp; skipped if missing.
