---

- name: Check k0s service
  ansible.builtin.stat:
    path: /etc/systemd/system/k0sworker.service
  register: worker_k0s_service

- name: Create k0s folder configuration
  become: true
  ansible.builtin.file:
    path: /etc/k0s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create join token
  become: true
  ansible.builtin.command:
    cmd: k0s token create --role=worker --expiry=1h
  register: worker_join_token
  until: worker_join_token.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  no_log: true
  delegate_to: '{{ groups.k0s_controller[0] }}'
  run_once: true
  when: not ansible_check_mode

- name: Save join token
  become: true
  ansible.builtin.copy:
    content: '{{ worker_join_token.stdout }}'
    dest: /etc/k0s/token
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: not worker_k0s_service.stat.exists and not ansible_check_mode

- name: Install Worker
  become: true
  ansible.builtin.command:
    cmd: >-
      k0s install worker
      --token-file /etc/k0s/token
      --profile {{ worker_profile }}
    creates: /etc/systemd/system/k0sworker.service
  when: not worker_k0s_service.stat.exists

- name: Start service
  become: true
  ansible.builtin.systemd:
    name: k0sworker
    state: started
    enabled: true
  ignore_errors: '{{ ansible_check_mode }}'
