---

- name: Add module config
  become: true
  ansible.builtin.copy:
    src: module-k0s.conf
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'

- name: Add sysctl config
  become: true
  ansible.builtin.copy:
    src: sysctl-k0s.conf
    dest: /etc/sysctl.d/1000-k8s.conf
    owner: root
    group: root
    mode: '0644'
  register: forwarding_ip4_sysctl

- name: Load modules
  become: true
  community.general.modprobe:
    name: '{{ module_item }}'
    state: present
  loop:
    - overlay
    - br_netfilter
  loop_control:
    loop_var: module_item

- name: Reload sysctl
  become: true
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: forwarding_ip4_sysctl is changed
